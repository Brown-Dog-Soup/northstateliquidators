<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002868">
  <title>NSL Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="icon" type="image/jpeg" href="/north_state_liquidators_logo.jpeg">
</head>
<body>
  <div class="bar">
    <div class="title-block">
      <a href="index.html" class="back" title="Staff Tools">←</a>
      <h1>NSL · Inventory<span class="sub" id="title-suffix"></span></h1>
    </div>
    <div class="meta">
      <a href="https://northstateliquidators.com" target="_blank" rel="noopener" style="margin-right:14px;font-size:12px;color:#444;">Public site ↗</a>
      <span id="me"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="row" style="gap:12px;flex-wrap:wrap;margin-bottom:16px;" id="summary-cards"></div>

    <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;">
      <div class="col field" style="min-width:200px;">
        <label for="search">Search title / brand / UPC / LPN</label>
        <input type="text" id="search" placeholder="e.g., Wondershop"/>
      </div>
      <div class="col field" style="max-width:200px;">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">All</option>
          <option value="available">Available</option>
          <option value="allocated">In a box</option>
          <option value="on_pallet">On a pallet</option>
          <option value="individual">Individual</option>
          <option value="ghost">Ghost</option>
          <option value="archived">Archived</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="col field" style="max-width:240px;">
        <label for="filter-lot">Lot</label>
        <select id="filter-lot"><option value="">All lots</option></select>
      </div>
      <button id="reset-filters" class="btn btn-ghost" style="padding:8px 14px;">Clear</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
      <div id="results-meta" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#666;"></div>
      <label style="font-size:12px;color:#666;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="select-all"> Select all shown
      </label>
    </div>
    <div class="items-list" id="results"></div>
  </div>

  <!-- #9 sticky action bar: build a box from the checked items (for barcode-less
       goods you can't scan, e.g. Bella Canvas shirts). -->
  <div id="build-bar" hidden style="position:sticky;bottom:0;z-index:50;background:var(--nc-navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,0.2);">
    <span style="font-family:'JetBrains Mono',monospace;font-size:14px;"><b id="build-count" style="color:var(--warehouse-yellow);font-size:18px;">0</b> selected</span>
    <input type="text" id="build-name" placeholder="New box name (optional)" style="flex:1;min-width:200px;font-size:15px;padding:10px 12px;border:2px solid #fff;color:#fff;background:transparent;">
    <button id="build-pallet" class="btn btn-yellow">Create box from selected →</button>
    <button id="build-delete" class="btn" style="background:#b00;color:#fff;border:1px solid #b00;">Delete selected</button>
    <button id="build-clear" class="btn btn-ghost" style="border-color:#fff;color:#fff;">Clear</button>
  </div>

  <script type="module" src="js/inventory.js"></script>
</body>
</html>
