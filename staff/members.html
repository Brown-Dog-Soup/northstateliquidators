<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002868">
  <title>NSL Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="icon" type="image/jpeg" href="/north_state_liquidators_logo.jpeg">
  <style>
    .stable { width:100%; border-collapse:collapse; font-size:13.5px; background:#fff; }
    .stable th { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.1em;
                 text-transform:uppercase; color:#666; text-align:left; padding:8px 12px 6px;
                 border-bottom:2px solid #002868; white-space:nowrap; }
    .stable td { padding:8px 12px; border-bottom:1px solid #eee6d8; white-space:nowrap;
                 font-variant-numeric:tabular-nums; }
    .stable td a { color:#002868; }
    .stable td.num { font-family:'JetBrains Mono',monospace; font-weight:700; }
    .twrap { overflow-x:auto; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title-block">
      <a href="index.html" class="back" title="Staff Tools">←</a>
      <h1>NSL · Members</h1>
    </div>
    <div class="meta">
      <a href="https://northstateliquidators.com" target="_blank" rel="noopener" style="margin-right:14px;font-size:12px;color:#444;">Public site ↗</a>
      <span id="me"></span>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
      <p id="members-count" style="margin:0;color:#555;">Loading…</p>
      <a id="members-export" class="btn btn-secondary" href="/api/members/export.csv" style="padding:8px 16px;font-size:12px;">⬇ Download CSV</a>
    </div>
    <p style="margin:0 0 12px;font-size:13px;color:#666;">Everyone who signed up on the website for a member number. Newest first. The CSV opens in Excel for email blasts.</p>
    <div class="twrap"><table class="stable" id="members-table"></table></div>
  </div>

  <script type="module" src="js/members.js"></script>
</body>
</html>
